spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/email_auto}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:240000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}
server.forward-headers-strategy=framework

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.token-encryption-key=${TOKEN_ENCRYPTION_KEY}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:${app.base-url}/auth/google/callback}
app.mail.default-delay-ms=${DEFAULT_EMAIL_DELAY_MS:1500}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.folder=${CLOUDINARY_FOLDER:email-auto/excel}
app.cloudinary.allowed-download-host=${CLOUDINARY_ALLOWED_DOWNLOAD_HOST:res.cloudinary.com}
